name: release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install llvm-mingw (i686 target)
        shell: pwsh
        run: |
          $ver = "20250319"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-x86_64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $dest = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest -Force
          $clang = Get-ChildItem $dest -Filter "i686-w64-mingw32-clang.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $clang) { throw "i686-w64-mingw32-clang.exe not in llvm-mingw zip" }
          $bin = Split-Path $clang
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $clang --version

      - name: Pack portable dist
        shell: pwsh
        run: |
          .\tools\pack-dist.ps1 -OutDir artifacts -ZipName "ascension-gm-dist.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascension-gm-dist
          path: artifacts/ascension-gm-dist.zip

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Latest ({0})', github.sha) }}
          files: artifacts/ascension-gm-dist.zip
          generate_release_notes: true
          make_latest: true
          body: |
            Portable GMToolBox. Unzip, run `GMToolBox.exe`, point Settings at `Ascension.exe`, click **Launch**.

            Includes ExtProxy (unlocked Lua, GmTeleport / GmFace / …), AscensionBoot, and base addons (GmTeleport, GmMapTeleport, GmShared, GmUI, GmTooltipFix, GmCmds).

            Discord (optional): https://discord.gg/3K24chnRKm
